services:

  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama

    ports:
      - "${OLLAMA_PORT}:11434"

    volumes:
      - ollama_models:/root/.ollama

    environment:
      OLLAMA_KEEP_ALIVE: "5m"

    networks:
      - ai-lab

    restart: unless-stopped

volumes:

  ollama_models:


networks:

  ai-lab:
    external: true
