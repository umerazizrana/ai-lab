services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-qdrant

    ports:
      - "${QDRANT_HTTP_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

    networks:
      - ai-lab

    restart: unless-stopped

volumes:

  qdrant_storage:


networks:

  ai-lab:
    external: true
